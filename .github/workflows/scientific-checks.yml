name: Scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MIN_EXPECTED_PYTHON_SOURCES: '20'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run all finite checks and retained-evidence comparisons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scientific-output
          ulimit -v 3584000
          ulimit -t 2700
          timeout --signal=TERM --kill-after=15s 1200s bash -c '
            set -euo pipefail
            python -B .github/scripts/check_repository.py
            python -B audit.py
            python -B reproduce.py --group all --out .scientific-output/campaign
          ' 2>&1 | tee .scientific-output/whole-run.log
      - name: Preserve raw output on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-raw-output
          path: .scientific-output/
          include-hidden-files: true
          if-no-files-found: warn
